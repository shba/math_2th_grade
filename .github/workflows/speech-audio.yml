name: Record speech clips

# Re-collects the phrases the app says and records any new or changed ones
# with edge-tts, then commits the clips back to the branch.

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/collect-speech.ts'
      - 'scripts/generate_speech.py'
      - 'speech/phrases.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speech-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run speech:collect
      - run: pip install -r scripts/requirements-speech.txt
      - run: python scripts/generate_speech.py
      - name: Commit clips
        run: |
          git add speech public/audio
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "speech-bot"
          git config user.email "speech-bot@users.noreply.github.com"
          git commit -m "Record speech clips"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
